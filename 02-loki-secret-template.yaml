# Replace the values below via your secret manager / Argo CD secret plugin.
# Do not commit real credentials to Git. Secret values are the only intended inputs.
apiVersion: v1
kind: Secret
metadata:
  name: loki-object-storage
  namespace: loki
type: Opaque
stringData:
  S3_ENDPOINT: "https://s3-compatible.example.com"
  S3_REGION: "us-east-1"
  S3_BUCKET: "replace-with-unique-loki-bucket"
  S3_ACCESS_KEY_ID: "REPLACE_USING_SECRET_MANAGER"
  S3_SECRET_ACCESS_KEY: "REPLACE_USING_SECRET_MANAGER"
  S3_FORCE_PATH_STYLE: "true"
