apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-gateway-nginx
  namespace: loki
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events { worker_connections 4096; }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
      server {
        listen 8080;
        location = /ready { return 200 "ready\n"; }
        location = /metrics { stub_status; }
        location /loki/api/v1/push {
          proxy_pass http://loki-write.loki.svc.cluster.local:3100$request_uri;
          proxy_set_header Host $host;
        }
        location /api/prom/push {
          proxy_pass http://loki-write.loki.svc.cluster.local:3100$request_uri;
          proxy_set_header Host $host;
        }
        location / {
          proxy_pass http://loki-read.loki.svc.cluster.local:3100$request_uri;
          proxy_set_header Host $host;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-gateway
  namespace: loki
  labels:
    app.kubernetes.io/name: loki-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-gateway
    spec:
      serviceAccountName: loki
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: loki-gateway
      containers:
      - name: nginx
        image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine # Pin to an approved immutable digest before production
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 20
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-config
        configMap:
          name: loki-gateway-nginx
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-gateway
  namespace: loki
  labels:
    app.kubernetes.io/name: loki-gateway
spec:
  selector:
    app.kubernetes.io/name: loki-gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
