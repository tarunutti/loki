apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: loki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-read-config
  namespace: loki
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["loki-config"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-read-config
  namespace: loki
subjects:
- kind: ServiceAccount
  name: loki
  namespace: loki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-read-config
